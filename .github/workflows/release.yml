name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  WEATHER_PI_REPO_URL: https://corrodedhash.github.io/weather-pi/
  WEATHER_PI_PUBLISHED_BASE: https://corrodedhash.github.io/weather-pi

jobs:
  check:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          cache: true

      - name: Install pinned tools
        run: mise install

      - name: Show active toolchain
        run: rustup show active-toolchain

      - name: Format, lint and test
        run: mise run check

  package:
    name: Package ${{ matrix.arch }}
    needs: check
    runs-on: ubuntu-latest
    # The public keyring secret lives in the protected release environment.
    environment: release
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: armhf
            target: arm-unknown-linux-gnueabihf
          - arch: arm64
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          cache: true

      - name: Install pinned tools and packaging dependencies
        run: |
          mise install
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev apt-utils gnupg

      - name: Restore public archive keyring
        env:
          KEYRING_B64: ${{ secrets.WEATHER_PI_ARCHIVE_KEYRING_B64 }}
        run: |
          set -euo pipefail
          mkdir -p packaging/keyring
          if [[ -n "$KEYRING_B64" ]]; then
            printf '%s' "$KEYRING_B64" | base64 -d > packaging/keyring/weather-pi-archive.gpg
          elif [[ -s packaging/keyring/weather-pi-archive.gpg ]]; then
            echo "Using the committed public archive keyring"
          else
            echo "::error::no archive keyring: set WEATHER_PI_ARCHIVE_KEYRING_B64 or commit packaging/keyring/weather-pi-archive.gpg"
            exit 1
          fi
          test -s packaging/keyring/weather-pi-archive.gpg

      - name: Build packages
        run: |
          set -euo pipefail
          version="$(scripts/version.sh from-tag "$GITHUB_REF_NAME")"
          echo "VERSION=$version" >>"$GITHUB_ENV"
          WEATHER_PI_VERSION="$version" scripts/build-packages.sh "${{ matrix.target }}"

      - name: Verify package contents
        run: scripts/test-package.sh --deb dist --arch "${{ matrix.arch }}" --version "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error

  package-check:
    name: Host package and repository checks
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          cache: true

      - name: Install pinned tools and packaging dependencies
        run: |
          mise install
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev apt-utils gnupg

      - name: Verify a host package
        run: scripts/test-package.sh

      - name: Verify versions, signing and retention
        run: scripts/test-release-pipeline.sh

  publish:
    name: Publish repository
    needs:
      - package
      - package-check
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install packaging and signing tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev apt-utils gnupg

      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true

      - name: Compute release version
        run: |
          version="$(scripts/version.sh from-tag "$GITHUB_REF_NAME")"
          echo "VERSION=$version" >>"$GITHUB_ENV"

      - name: Refuse a version that is not strictly greater
        run: |
          set -euo pipefail
          : >published-Packages
          for arch in armhf arm64; do
            url="$WEATHER_PI_PUBLISHED_BASE/dists/trixie/main/binary-$arch/Packages"
            if ! status="$(curl -sSL --retry 3 -o "published-$arch" -w '%{http_code}' "$url")"; then
              echo "::error::could not fetch $url"
              exit 1
            fi
            case "$status" in
              200)
                cat "published-$arch" >>published-Packages
                printf '\n' >>published-Packages
                ;;
              404)
                echo "No published index yet for $arch; treating as empty"
                ;;
              *)
                echo "::error::unexpected HTTP $status for $url"
                exit 1
                ;;
            esac
          done
          if [[ -s published-Packages ]]; then
            scripts/version.sh check "$VERSION" published-Packages
          fi

      - name: Restore the published apt branch
        run: |
          set -euo pipefail
          apt_ref="$(git ls-remote --heads origin apt)"
          if [[ -n "$apt_ref" ]]; then
            git fetch --depth=1 origin apt
            mkdir -p target/repo
            git archive FETCH_HEAD | tar -x -C target/repo
            echo "Restored the existing apt repository"

            # The HTTP check above can be empty (first Pages deploy or a
            # transiently missing index). Never publish below a version that
            # the restored branch already contains.
            : >restored-Packages
            for arch in armhf arm64; do
              index="target/repo/dists/trixie/main/binary-$arch/Packages"
              if [[ -f "$index" ]]; then
                cat "$index" >>restored-Packages
                printf '\n' >>restored-Packages
              fi
            done
            if [[ -s restored-Packages ]]; then
              scripts/version.sh check "$VERSION" restored-Packages
            fi
          else
            echo "No apt branch yet; starting an empty repository"
            mkdir -p target/repo
          fi

      - name: Import archive key
        env:
          ARCHIVE_KEY: ${{ secrets.WEATHER_PI_ARCHIVE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$ARCHIVE_KEY" ]]; then
            echo "::error::WEATHER_PI_ARCHIVE_KEY is not set in the release environment"
            exit 1
          fi
          install -d -m 0700 "$RUNNER_TEMP/gnupg"
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          printf '%s' "$ARCHIVE_KEY" | gpg --batch --import

      - name: Generate and sign the repository
        env:
          ARCHIVE_PASSPHRASE: ${{ secrets.WEATHER_PI_ARCHIVE_PASSPHRASE }}
        run: |
          set -euo pipefail
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          export WEATHER_PI_ARCHIVE_KEY="$(
            gpg --list-secret-keys --with-colons |
              awk -F: '/^sec:/ { print $5; exit }'
          )"
          export WEATHER_PI_ARCHIVE_PASSPHRASE="$ARCHIVE_PASSPHRASE"
          DIST_DIR=dist REPO_DIR=target/repo scripts/apt-repo.sh

      - name: Stage release assets
        run: |
          set -euo pipefail
          assets=target/release-assets
          rm -rf "$assets"
          mkdir -p "$assets"
          cp dist/*.deb "$assets/"
          cp target/repo/dists/trixie/Release "$assets/"
          cp target/repo/dists/trixie/InRelease "$assets/"
          cp target/repo/dists/trixie/main/binary-armhf/Packages "$assets/Packages-armhf"
          cp target/repo/dists/trixie/main/binary-arm64/Packages "$assets/Packages-arm64"
          (
            cd "$assets"
            sha256sum ./*.deb Release InRelease Packages-armhf Packages-arm64 >SHA256SUMS
          )
          cat "$assets/SHA256SUMS"

      - name: Publish the apt branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          publish="$RUNNER_TEMP/apt"
          mkdir -p "$publish"
          cp -a target/repo/. "$publish/"
          cd "$publish"
          git init -q
          git checkout -q -b apt
          git config user.name "weather-pi release bot"
          git config user.email "releases@users.noreply.github.com"
          git add -A
          git commit -q -m "apt: $GITHUB_REF_NAME ($VERSION)"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin apt

      - name: Attach artifacts to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --notes "weather-pi $VERSION"

          gh release upload "$GITHUB_REF_NAME" target/release-assets/* --clobber
